# RaySpec — local Postgres.
# Two databases on one server:
#   - rayspec      : the main DB (run journal, conversation store, db-spike entities)
#   - rayspec_shadow: a SEPARATE throwaway DB Atlas uses for migration dry-runs.
# Shadow DB must be empty/disposable — Atlas drops & recreates its contents on every diff.
# On a new volume the init scripts also create the three database roles of the isolated posture
# (rayspec_migrator, rayspec_runtime, rayspec_snapshot) in `rayspec`, from the SAME setup SQL an
# operator runs (packages/kernel/db/sql/database-roles.sql), with dev-only passwords. The default
# `rayspec` superuser is unchanged, so a one-role local boot works exactly as before; see
# docs/database-isolation.md for booting with role separation.
services:
  postgres:
    # Pinned by digest: the same multi-platform index CI's service containers use (linux/amd64 and
    # linux/arm64 among its platforms), so a local run and a CI run test against the same Postgres
    # build. Move both pins together.
    image: postgres:16@sha256:17e67d7b9890c99b055ba1e0d5c5be4ec27c9d3a72bda32db24a5e5d8a85af0c
    # container_name + host port default to rayspec-pg / 5433 (what every doc and test expects).
    # Override BOTH — together with COMPOSE_PROJECT_NAME (which namespaces the data volume) — to run a
    # second, fully isolated instance on the same machine. See docs/getting-started.md.
    container_name: ${RAYSPEC_PG_CONTAINER:-rayspec-pg}
    restart: unless-stopped
    environment:
      POSTGRES_USER: rayspec
      POSTGRES_PASSWORD: rayspec
      POSTGRES_DB: rayspec
    ports:
      # Host 5433 -> container 5432, to avoid colliding with a local PG on 5432.
      - "${RAYSPEC_PG_PORT:-5433}:5432"
    volumes:
      - rayspec-pgdata:/var/lib/postgresql/data
      - ./scripts/init-shadow-db.sql:/docker-entrypoint-initdb.d/10-init-shadow-db.sql:ro
      - ./packages/kernel/db/sql/database-roles.sql:/docker-entrypoint-initdb.d/20-database-roles.sql:ro
      - ./scripts/init-dev-role-passwords.sql:/docker-entrypoint-initdb.d/30-dev-role-passwords.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rayspec -d rayspec"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  rayspec-pgdata:
