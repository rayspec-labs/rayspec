# osv-scanner configuration.
#
# There are currently NO suppressions: every advisory the scanner matches fails the dependency-audit
# lane. This file exists to keep the sanctioned exception mechanism documented and in one place —
# a triaged, genuinely unreachable advisory is recorded here as an `[[IgnoredVulns]]` entry carrying
# both a `reason` and an `ignoreUntil` expiry, never by loosening the gate.
#
# Prefer the fix to the exception. The last entry to live here (GHSA-frvp-7c67-39w9, a Windows-only
# `serve-static` path traversal in the `@hono/node-server` copy behind `@modelcontextprotocol/sdk`)
# was retired rather than renewed: the advisory's fixed version, 1.19.15, sits inside the range that
# SDK declares (`^1.19.9`), so the copy is pinned forward via a scoped `pnpm.overrides` entry the way
# the two `nanoid` copies are. An exception whose reachability argument is sound is still worse than
# a patch bump that is available.
