# osv-scanner configuration for the CONSUMER install scan in ci.yml ("Consumer install audit").
#
# That step installs the packed release with npm, the way a consumer does, and scans the resulting
# package-lock.json. It sees what the workspace lockfile scan cannot: copies a dependency pins in its
# own npm-shrinkwrap.json, which no pnpm.overrides entry reaches. The root osv-scanner.toml governs
# the workspace scan; this file governs only the consumer scan, and is passed to it with --config.
#
# Every entry below is a copy pinned by the npm-shrinkwrap.json of @earendil-works/pi-coding-agent
# 0.79.9, which reaches consumers through @rayspec/adapter-pi. The fix is to move the adapter to
# pi-coding-agent and pi-ai 0.86.0 or later, whose shrinkwrap carries patched versions; that crosses
# breaking SDK releases (the AuthStorage export the adapter uses is gone since 0.80.8), so it is its
# own change. Each entry expires on 2026-10-31: the scan fails again then, whether or not the move
# has landed. Renew only with a reason that still holds, never by lowering the gate.

[[IgnoredVulns]]
id = "GHSA-3jxr-9vmj-r5cp"
ignoreUntil = 2026-10-31
reason = "brace-expansion 5.0.6, pinned by the npm-shrinkwrap.json of @earendil-works/pi-coding-agent 0.79.9 (through @rayspec/adapter-pi); no override reaches it. Fixed by moving to pi-coding-agent 0.86.0 or later."

