reason = "brace-expansion 5.0.6, pinned by the npm-shrinkwrap.json of @earendil-works/pi-coding-agent 0.79.9 (through @rayspec/adapter-pi); no override reaches it. Checked 2026-10-06: every release up to 0.80.10 pins the same copy, and the first release that pins none with an advisory is 1.0.1, which the adapter cannot take without changes (AuthStorage is no longer exported since 0.80.8)."

