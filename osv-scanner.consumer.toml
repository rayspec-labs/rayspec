# osv-scanner configuration for the CONSUMER install scan in ci.yml ("Consumer install audit") and
# for the image install scan in candidate.yml ("Image install audit"), which scans the lockfile the
# runtime image was installed from.
#
# The consumer step installs the packed release with npm, the way a consumer does, and scans the
# resulting package-lock.json. It sees what the workspace lockfile scan cannot: copies a dependency
# pins in its own npm-shrinkwrap.json, which no pnpm.overrides entry reaches. The root
# osv-scanner.toml governs the workspace scan; this file governs only these two scans, and is passed
# to them with --config.
#
# Every entry below is a copy pinned by the npm-shrinkwrap.json of @earendil-works/pi-coding-agent
# 0.79.9, which reaches consumers through @rayspec/adapter-pi: undici 8.5.0 (15 advisories),
# brace-expansion 5.0.6 (6) and protobufjs 7.6.4 (1).
#
# Checked on 2026-10-06 against the registry and OSV.dev, every release from 0.79.9 to 1.0.4 (the
# newest):
#   - 0.79.10 to 0.80.10 pin the same three copies, so no release the adapter can take without
#     changes clears an entry.
#   - 0.81.0 to 0.85.1 move the copies forward, each to a version that still carries advisories.
#   - 0.86.0 to 1.0.0 pin undici 8.10.2 and protobufjs 7.6.6, which carry no advisory, and
#     brace-expansion 5.0.9, which still carries three of the six.
#   - 1.0.1 to 1.0.4 ship no npm-shrinkwrap.json and depend on undici 8.10.2 and brace-expansion
#     5.0.12, which carry no advisory. 1.0.1 is the first release that clears all 22.
# The adapter cannot move to any of the patched releases unchanged: since 0.80.8 the SDK no longer
# exports AuthStorage and takes its credentials and models through an asynchronous `modelRuntime`
# option in place of `authStorage` and `modelRegistry`, and the adapter's recorded fixtures are
# bound to the SDK version. That move is its own change. Until it lands each entry expires on
# 2026-12-06: the scan fails again then. Renew only with a reason that still holds and a check
# that was made again, never by lowering the gate.

[[IgnoredVulns]]
