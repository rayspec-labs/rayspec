# The same deployment, with the claimed section's key MISTYPED — `auditting` for `auditing`.
#
# No pack claims `auditting`, so this document is not deployable: the boot, `plan`,
# `deploy --dry-run` and `doctor --with-packs` all resolve this deployment's packs before they judge
# it, find no owner for the key, and refuse it as `unknown_field` exactly as they would on a
# pack-free document.
#
# It exists to pin the TWO surfaces that answer differently, because both load no pack by design.
# `rayspec deploy --check-env` cannot tell this key from a legitimately claimed one and lifts it out
# unexamined — it reports no error for a document the pack-loading commands refuse, and names the key
# in `notChecked` instead. A bare `rayspec doctor` (no `--with-packs`) lifts it the same way and names
# it in `notResolved` instead. Both are a real loss of coverage on a pack-bearing document, and the
# cases in `packages/app/cli/src/pack-sections.test.ts` drive all three verdicts off this one document
# — the two lifts and the `--with-packs` refusal that is their control — rather than leaving the
# divergence to be discovered by an operator.
version: '1.0'
metadata:
  name: fixture-pack-mistyped-key-deployment
  description: The deployment whose claimed-section key is mistyped, so no pack claims it.
extensions:
  - id: fixture-pack
    module: ./dist
    version: 1.0.0
auditting:
  retentionDays: 30
  redactPayloads: true
