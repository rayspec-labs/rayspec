<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asset catalog</title>
    <link rel="stylesheet" href="/catalog.css" />
    <script src="/catalog.js" defer></script>
  </head>
  <body>
    <h1>Asset catalog</h1>
    <p>Paste an organization-scoped access token to list the catalog.</p>
    <form id="token-form">
      <label>Access token <input name="token" type="password" required /></label>
      <button type="submit">List</button>
    </form>
    <ul id="items"></ul>
    <p id="status" role="status"></p>
  </body>
</html>
