<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes UI</title>
    <meta name="description" content="notes-ui static frontend served alongside the API" />
  </head>
  <body>
    <main id="app" data-static-frontend="notes-ui">
      <h1>Notes UI</h1>
      <p>This page is served statically by the backend from <code>web/dist</code>.</p>
      <ul id="notes"></ul>
    </main>
    <!-- A FILE, not an inline script element: the default Content-Security-Policy a served frontend
         carries (`default-src 'self'`, no `script-src`) blocks inline code, and a same-origin file
         is allowed. The mount is at `/`, so `/app.js` is `web/dist/app.js`. -->
    <script src="/app.js" defer></script>
  </body>
</html>
